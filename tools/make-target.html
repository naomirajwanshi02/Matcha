<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matcha card maker</title>
<link rel="stylesheet" href="../css/style.css">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
<style>
  #stage { z-index: 0; }
  .panel { position: relative; z-index: 2; margin: 14px; padding: 14px; max-width: 760px; background: #f4f5f6; border-radius: 12px; font: 13px/1.5 ui-monospace, Consolas, monospace; user-select: text; }
  .panel img { max-width: 100%; display: block; margin: 10px 0; box-shadow: 0 0 0 1px #999; }
  button { font: inherit; padding: 8px 14px; margin-right: 6px; }
  #log { white-space: pre-wrap; }
  body { overflow: auto; touch-action: auto; }
</style></head>
<body>
<canvas id="stage"></canvas>
<div class="panel">
  <p>Draws <b>target.png</b> (the card you print and scan) from a render of the tea table, then compiles it into <b>targets.mind</b> with MindAR's own compiler. Run from <code>tools/serve.ps1</code> so the files can be saved back. <code>?build=1</code> does both.</p>
  <button id="draw">1 &middot; Draw target</button><button id="compile">2 &middot; Compile .mind</button>
  <div id="log"></div><div id="out"></div>
</div>
<script type="module">
import { initStage, cam, tween } from '../js/stage.js';
import { buildWorld } from '../js/world.js';

const W = 1500, H = 1000;
const log = t => { document.getElementById('log').textContent += t + '\n'; };
const out = document.getElementById('out');
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }

initStage(document.getElementById('stage'));
const world = buildWorld();
world.bowl.setMl(70); world.bowl.setState({ matcha: 1, fine: .95, coarse: .25 });
world.bowl.root.rotation.y = .1;
world.holder; world.whisk.position.set(-8, 0, 12);

async function draw() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), r = rng(2027);
  g.fillStyle = '#e8eaec'; g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(W / 2, H * .45, 80, W / 2, H * .45, W * .7);
  gr.addColorStop(0, '#f6f7f8'); gr.addColorStop(1, '#cfd2d6'); g.fillStyle = gr; g.fillRect(0, 0, W, H);

  // 3D render of the tea table, shot to the card's aspect
  Object.assign(cam, { tx: 0, ty: 5, tz: 3, span: 60, elev: .5, azim: 0, sway: 0 });
  window.__step(.3);
  const gl = document.getElementById('stage');
  const sw = gl.width, sh = gl.height, k = Math.max(W / sw, (H * .78) / sh);
  const dw = sw * k, dh = sh * k;
  g.drawImage(gl, (W - dw) / 2, 150 + (H * .78 - dh) / 2, dw, dh);

  // fibre and ink speckle: dense, non-repeating texture is what the tracker locks onto
  for (let i = 0; i < 2600; i++) {
    const x = r() * W, y = r() * H, a = r() * 6.28, l = 3 + r() * 14;
    g.strokeStyle = `rgba(90,94,100,${0.08 + r() * 0.2})`; g.lineWidth = 0.6 + r();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 1100; i++) { g.fillStyle = `rgba(42,43,46,${0.15 + r() * 0.45})`; g.beginPath(); g.arc(r() * W, r() * H, 0.6 + r() * 1.8, 0, 6.28); g.fill(); }

  // plate frame and ruler
  g.strokeStyle = '#2a2b2e'; g.lineWidth = 4; g.strokeRect(22, 22, W - 44, H - 44);
  g.strokeStyle = '#5c5e63'; g.lineWidth = 1.5; g.strokeRect(34, 34, W - 68, H - 68);
  g.fillStyle = '#5c5e63'; g.font = '13px Consolas,monospace';
  for (let x = 40, n = 0; x < W - 40; x += 12, n++) {
    const major = n % 5 === 0; g.strokeStyle = '#2a2b2e'; g.lineWidth = major ? 2 : 1;
    g.beginPath(); g.moveTo(x, 34); g.lineTo(x, 34 + (major ? 16 : 8)); g.stroke();
    if (n % 10 === 0) g.fillText(String(n), x + 3, 64);
  }
  for (let y = 40, n = 0; y < H - 40; y += 12, n++) {
    const major = n % 5 === 0; g.lineWidth = major ? 2 : 1;
    g.beginPath(); g.moveTo(34, y); g.lineTo(34 + (major ? 16 : 8), y); g.stroke();
    g.beginPath(); g.moveTo(W - 34, y); g.lineTo(W - 34 - (major ? 16 : 8), y); g.stroke();
  }
  for (const [x, y] of [[44, 44], [W - 44, 44], [44, H - 44], [W - 44, H - 44]]) { g.fillStyle = '#d6d8db'; g.beginPath(); g.arc(x, y, 5, 0, 6.28); g.fill(); g.lineWidth = 1.5; g.strokeStyle = '#2a2b2e'; g.stroke(); }

  // title block
  g.fillStyle = '#2a2b2e'; g.font = '700 96px Helvetica,Arial,sans-serif'; g.fillText('Matcha', 84, 150);
  g.fillStyle = '#5c5e63'; g.font = '22px Consolas,monospace'; g.fillText('FIG. 01 · SCAN ME TO WHISK A BOWL', 88, 196);
  g.fillStyle = '#7a9a22'; g.beginPath(); g.arc(W - 150, 118, 54, 0, 6.28); g.fill();
  g.fillStyle = '#f4f5f6'; g.font = '700 22px Consolas,monospace'; g.textAlign = 'center'; g.fillText('SCAN', W - 150, 126); g.textAlign = 'left';
  // step strip along the bottom, no text but numbers
  g.fillStyle = '#2a2b2e'; g.font = '16px Consolas,monospace';
  for (let i = 0; i < 12; i++) { g.fillText(String(i + 1).padStart(2, '0'), 90 + i * 112, H - 62); g.fillRect(90 + i * 112, H - 54, 60, 4); }

  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  out.innerHTML = ''; const shown = new Image(); shown.src = URL.createObjectURL(blob); out.appendChild(shown);
  const res = await fetch('/__save?name=target.png', { method: 'POST', body: blob });
  log(`target.png: ${res.ok ? 'saved' : 'save failed'} (${(blob.size / 1024).toFixed(0)} KB)`);
}

async function compile() {
  log('loading MindAR compiler...');
  await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
  const img = new Image(); img.src = '../target.png?' + Date.now(); await img.decode();
  const compiler = new window.MINDAR.IMAGE.Compiler(); let last = -10;
  const data = await compiler.compileImageTargets([img], p => { if (p - last >= 10) { last = p; log(`compiling ${p.toFixed(0)}%`); } });
  const t = data[0];
  log(`detection points: ${t.matchingData.reduce((n, l) => n + l.maximaPoints.length + l.minimaPoints.length, 0)}; tracking points: ${t.trackingData.reduce((n, l) => n + l.points.length, 0)}`);
  const buf = await compiler.exportData();
  const res = await fetch('/__save?name=targets.mind', { method: 'POST', body: new Blob([buf]) });
  log(`targets.mind: ${res.ok ? 'saved' : 'save failed'}`);
  window.__done = true;
}

document.getElementById('draw').onclick = draw;
document.getElementById('compile').onclick = compile;
if (new URLSearchParams(location.search).has('build')) draw().then(compile).catch(e => { log('ERROR ' + e); window.__done = 'error'; });
</script>
</body></html>
